name: "[Engine] E2E Tests"

on:
  # E2E is the only suite that talks to a real provider, so it is the only
  # one that can catch a wire-contract break: a payload the engine builds
  # happily and the API rejects. Until this ran on PRs, such a change could
  # pass every check and only fail at the release gate — which is exactly
  # how `cache_control` on a Responses content block reached a release run
  # (400 unknown_parameter; see tests/unit/agents/test_responses_input_wire_safety.py).
  pull_request:
    branches: [main]
    paths:
      - "engine/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Taskfile.yml"
      - "pyrightconfig.json"
      - ".github/workflows/engine--e2e-tests.yml"
  workflow_dispatch:
  workflow_call:
    secrets:
      INFISICAL_CLIENT_ID:
        required: true
      INFISICAL_CLIENT_SECRET:
        required: true

env:
  PYTHON_VERSION: "3.10"
  INFISICAL_CLI_VERSION: "0.41.2"
  INFISICAL_PROJECT_ID: "822ab0ec-ad72-4b7d-9f49-93b43be4eda0"

permissions:
  checks: write
  contents: read

jobs:
  e2e-tests:
    name: E2E Tests
    runs-on: depot-ubuntu-latest
    timeout-minutes: 45
    # Fork PRs do not receive org secrets. Succeed (don't skip) so the required
    # check stays green; live E2E still runs on same-repo PRs, workflow_dispatch,
    # and the engine release workflow_call.
    env:
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

    steps:
      - name: Skip authenticated E2E on fork PRs
        if: env.IS_FORK_PR == 'true'
        run: |
          echo "Skipping live E2E: Infisical credentials are withheld from fork PRs."
          echo "Unit + integration already ran. Live E2E runs on merge to main / release."

      - name: Checkout code
        if: env.IS_FORK_PR != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: env.IS_FORK_PR != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        if: env.IS_FORK_PR != 'true'
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install go-task
        if: env.IS_FORK_PR != 'true'
        uses: arduino/setup-task@v2
        with:
          version: 3.x

      - name: Install Infisical CLI
        if: env.IS_FORK_PR != 'true'
        run: |
          curl -fsSL "https://github.com/Infisical/infisical/releases/download/infisical-cli%2Fv${INFISICAL_CLI_VERSION}/infisical_${INFISICAL_CLI_VERSION}_linux_amd64.deb" -o /tmp/infisical.deb
          sudo dpkg -i /tmp/infisical.deb
          rm /tmp/infisical.deb

      - name: Install engine dependencies
        if: env.IS_FORK_PR != 'true'
        run: task ci:setup

      - name: Authenticate Infisical
        if: env.IS_FORK_PR != 'true'
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
        run: |
          TOKEN=$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" \
            --client-secret="$INFISICAL_CLIENT_SECRET" \
            --silent --plain)
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run E2E tests
        if: env.IS_FORK_PR != 'true'
        run: task test:e2e

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: env.IS_FORK_PR != 'true' && always()
        with:
          report_paths: "test-results/e2e/junit.xml"
          update_check: true
          detailed_summary: true
          include_passed: true
          include_time_in_summary: true
          fail_on_failure: true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: env.IS_FORK_PR != 'true' && always()
        with:
          name: engine-e2e-test-results
          path: test-results/e2e/
          retention-days: 14
